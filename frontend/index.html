<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acumatica Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Acumatica Dashboard</h1>
      <div class="controls">
        <span id="health" class="health">checking…</span>
        <label class="auto">
          <input type="checkbox" id="autoRefresh" /> Auto-refresh (30s)
        </label>
        <button id="refresh">Refresh</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="open-po-lines">Open PO Lines</button>
      <button class="tab" data-view="purchase-receipts">Purchase Receipts</button>
      <button class="tab" data-view="inventory-history">Inventory History</button>
    </nav>

    <main>
      <div id="status" class="status"></div>
      <div id="tableWrap" class="table-wrap"></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
